<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="settings-page">
      <section class="settings-card" aria-labelledby="settings-heading">
        <header class="settings-header">
          <h1 id="settings-heading">Settings</h1>
          <p class="settings-subtitle">Update your profile information.</p>
        </header>

        <form id="settings-form" class="settings-form" novalidate>
          <div class="form-group">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              autocomplete="name"
              placeholder="Enter your name"
              required
            />
            <p class="field-error" id="name-error" role="alert"></p>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="Enter your email"
              required
            />
            <p class="field-error" id="email-error" role="alert"></p>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Save changes</button>
          </div>

          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="js/settings.js"></script>
  </body>
</html>
